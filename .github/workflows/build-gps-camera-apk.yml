name: Build GPS Camera APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-gps-camera-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring GPS Camera source from build branch
        run: |
          git fetch origin gps-camera-apk
          git checkout origin/gps-camera-apk -- GPSCamera

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35 is installed
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: GPSCamera
        run: gradle --no-daemon assembleDebug

      - name: Split APK into text chunks
        run: |
          rm -rf gps-camera-output
          mkdir -p gps-camera-output
          cp GPSCamera/app/build/outputs/apk/debug/app-debug.apk /tmp/GPSCamera-S25Plus.apk
          sha256sum /tmp/GPSCamera-S25Plus.apk | awk '{print $1}' > gps-camera-output/SHA256.txt
          stat -c '%s' /tmp/GPSCamera-S25Plus.apk > gps-camera-output/SIZE.txt
          base64 -w 0 /tmp/GPSCamera-S25Plus.apk > /tmp/apk.b64
          split -b 45000 -d -a 3 /tmp/apk.b64 gps-camera-output/part-
          echo "ready" > gps-camera-output/STATUS.txt

      - name: Commit APK chunks to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps-camera-output
          git commit -m "Build GPS Camera APK chunks" || exit 0
          git push origin HEAD:main
