name: Build GPS Camera APK

on:
  push:
    branches:
      - gps-camera-apk
    paths:
      - 'GPSCamera/**'
      - '.github/workflows/build-gps-camera-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        working-directory: GPSCamera
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp GPSCamera/app/build/outputs/apk/debug/app-debug.apk GPSCamera-S25Plus.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPSCamera-S25Plus
          path: GPSCamera-S25Plus.apk
          if-no-files-found: error
          retention-days: 7
